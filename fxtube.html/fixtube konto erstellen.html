<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FxTube - Anmelden</title>
  <link rel="stylesheet" href="fixtube.css">
</head>
<body>
  <div class="login-page">
    <nav class="login-nav">
      <a href="index.html">
        <img class="logo" src="videos/logo/ChatGPT Image 28. Juni 2026, 02_32_21.png" alt="FxTube Logo">
      </a>
    </nav>

    <section class="login-card">
      <h2>Bei FxTube anmelden</h2>
      <form>
        <div class="form-group">
          <label for="email">E-Mail oder Benutzername</label>
          <input id="email" type="text" placeholder="deine@email.com">
        </div>
        <div class="form-group">
          <label for="password">Passwort</label>
          <input id="password" type="password" placeholder="••••••••">
        </div>
        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox">
            Angemeldet bleiben
          </label>
          <a href="#">Passwort vergessen?</a>
        </div>
        <button type="submit">Einloggen</button>
      </form>
      <p class="login-footer">
        Noch kein Konto? <a href="#">Jetzt erstellen</a>
      </p>
    </section>
  </div>
</body>
</html>
