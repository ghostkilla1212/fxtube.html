<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live gehen</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="live-page">
      <section class="live-player-card">
        <span class="live-badge">LIVE</span>
        <h1>Willst du live gehen?</h1>
        <p>Starte direkt deinen nächsten Stream und teile ihn mit deinen Zuschauern.</p>

        <div class="live-actions">
          <a href="#" class="live-btn">Jetzt starten</a>
          <span class="live-pill">Bereit für den Stream</span>
        </div>

        <div class="live-stats">
          <div>
            <strong>33.00k</strong>
            <span>Zuschauer sind grade auf dein profil aktuell</span>
          </div>
          <div>
            <strong>500.000</strong>
            <span>Follower</span>
          </div>
          <div>
            <strong>22</strong>
            <span>du bist live gewesen</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
